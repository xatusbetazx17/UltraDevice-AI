[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultradevice"
version = "0.3.0"
description = "UltraDevice AI wearable reference controller and energy simulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Marcelo Collado"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.6,<3"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]
hardware = ["pyserial>=3.5,<4"]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/xatusbetazx17/UltraDevice-AI"

[project.scripts]
ultradevice = "ultradevice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultradevice = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
